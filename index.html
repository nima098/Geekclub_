    <script>
      // Immediately unregister Service Workers & purge CacheStorage on HTML load to prevent stale app caching
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        });
      }
    </script>
    <script>
      (function() {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            try {
              var ws = new OriginalWebSocket(url, protocols);
              ws.addEventListener('error', function(e) {
                if (e && typeof e.stopImmediatePropagation === 'function') {
                  e.stopImmediatePropagation();
                }
              });
              return ws;
            } catch (err) {
              return {
                addEventListener: function() {},
                removeEventListener: function() {},
                send: function() {},
                close: function() {},
                readyState: 3
              };
            }
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function (event) {
          var str = String(event.reason || '') + String((event.reason && event.reason.message) || '') + String((event.reason && event.reason.stack) || '');
          if (str.toLowerCase().includes('websocket') || str.toLowerCase().includes('vite')) {
            event.preventDefault();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function (event) {
          var str = String(event.message || '') + String(event.filename || '');
          if (str.toLowerCase().includes('websocket') || str.toLowerCase().includes('vite')) {
            event.preventDefault();
            if (typeof event.stopPropagation === 'function') event.stopPropagation();
          }
        }, true);
      })();
    </script>
